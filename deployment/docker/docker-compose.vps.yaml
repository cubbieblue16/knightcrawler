name: knightcrawler

networks:
  knightcrawler-network:
    name: knightcrawler-network
    driver: bridge
  cloudflared_net:
    name: cloudflared_net
    external: true

volumes:
  postgres:
  lavinmq:
  redis:

x-image-tag: &image_tag ${KC_IMAGE_TAG:-latest}

services:
  postgres:
    env_file: stack.env
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD", "sh", "-c", "pg_isready -h localhost -U $$POSTGRES_USER"]
      timeout: 10s
      interval: 10s
      retries: 3
      start_period: 10s
    networks:
      - knightcrawler-network
    restart: unless-stopped
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    env_file: stack.env
    image: redis/redis-stack:latest
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      timeout: 10s
      interval: 10s
      retries: 3
      start_period: 10s
    networks:
      - knightcrawler-network
    restart: unless-stopped
    volumes:
      - redis:/data

  lavinmq:
    env_file: stack.env
    image: cloudamqp/lavinmq:latest
    healthcheck:
      test: ["CMD-SHELL", "lavinmqctl status"]
      timeout: 10s
      interval: 10s
      retries: 3
      start_period: 10s
    networks:
      - knightcrawler-network
    restart: unless-stopped
    volumes:
      - lavinmq:/var/lib/lavinmq/

  migrator:
    depends_on:
      postgres:
        condition: service_healthy
    env_file: stack.env
    image: ghcr.io/cubbieblue16/knightcrawler-migrator:${KC_IMAGE_TAG:-latest}
    networks:
      - knightcrawler-network
    restart: "no"

  metadata:
    depends_on:
      migrator:
        condition: service_completed_successfully
    env_file: stack.env
    image: ghcr.io/cubbieblue16/knightcrawler-metadata:${KC_IMAGE_TAG:-latest}
    networks:
      - knightcrawler-network
    restart: "no"

  addon:
    depends_on:
      metadata:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      lavinmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: stack.env
    hostname: knightcrawler-addon
    image: ghcr.io/cubbieblue16/knightcrawler-addon:${KC_IMAGE_TAG:-latest}
    labels:
      logging: promtail
    networks:
      - knightcrawler-network
      - cloudflared_net
    restart: unless-stopped

  consumer:
    depends_on:
      metadata:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      lavinmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: stack.env
    image: ghcr.io/cubbieblue16/knightcrawler-consumer:${KC_IMAGE_TAG:-latest}
    labels:
      logging: promtail
    networks:
      - knightcrawler-network
    restart: unless-stopped

  debridcollector:
    depends_on:
      metadata:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      lavinmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: stack.env
    image: ghcr.io/cubbieblue16/knightcrawler-debrid-collector:${KC_IMAGE_TAG:-latest}
    labels:
      logging: promtail
    networks:
      - knightcrawler-network
    restart: unless-stopped

  producer:
    depends_on:
      metadata:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      lavinmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: stack.env
    image: ghcr.io/cubbieblue16/knightcrawler-producer:${KC_IMAGE_TAG:-latest}
    labels:
      logging: promtail
    networks:
      - knightcrawler-network
    restart: unless-stopped
